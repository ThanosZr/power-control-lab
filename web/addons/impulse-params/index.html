<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Κρουστικές πηγές</title>
<link rel="stylesheet" href="../addon.css">
</head>
<body>
<header><b>Κρουστικές πηγές</b> <small class="muted">παράμετροι από κώδικα (pcl.impulse)</small></header>
<div class="row"><label>Στοιχείο <select id="target"></select></label><span id="cur" class="muted small"></span></div>
<nav class="tabs"><button data-tab="i" class="on">Ρεύμα Heidler</button><button data-tab="v">Κρουστική τάση</button><button data-tab="csv">CSV εργαλείων</button></nav>
<section id="tab-i">
 <div class="grid">
  <label>T1 (μs) <input id="i-T1" value="1"></label><label>T2 (μs) <input id="i-T2" value="200"></label>
  <label><span>I<sub>m</sub> (A)</span> <input id="i-Im" value="-100000"></label><label>n <input id="i-n" value="10"></label>
  <label>η <select id="i-H"><option value="auto">AutoH: η = μέγιστο της μορφής</option><option value="fixed">FixedH: δίνεται</option></select></label>
  <label>η (FixedH) <input id="i-Hv" value="0.93"></label>
 </div>
 <button id="i-fit" class="primary">Υπολογισμός</button>
</section>
<section id="tab-v" hidden>
 <div class="grid">
  <label>Προφίλ <select id="v-prof"><option value="IEC2025_LI">IEC 60060-1:2025 LI 1,2/50</option><option value="IEC2025_SI">IEC 60060-1:2025 SI 170/2500</option><option value="IEC2010_SI_LEGACY">SI 250/2500 (Tp/T2, παλιό)</option><option value="CUSTOM">Ελεύθερο</option></select></label>
  <label>Βάση <select id="v-meth"><option value="IEC_T1_T2">T1/T2 (IEC)</option><option value="TP_T2">Tp/T2</option><option value="T10_90_T50">t10–90/t50</option></select></label>
  <label>X (μs) <input id="v-X" value="1.2"></label><label>Y (μs) <input id="v-Y" value="50"></label>
  <label><span>V<sub>p</sub> (V)</span> <input id="v-Vp" value="100000"></label>
 </div>
 <button id="v-fit" class="primary">Υπολογισμός</button> <button id="v-check">Έλεγχος της τωρινής πηγής</button>
</section>
<section id="tab-csv" hidden>
 <p class="small">Γραμμές από <code>ls_params/*.csv</code> (Lightning Impulse Manager) ή <code>voltage_impulse_params/*.csv</code> (Voltage Impulse GUI), χωρίς να τρέξει κώδικας MATLAB.</p>
 <input type="file" id="csv" accept=".csv">
</section>
<div id="out"></div>
<div class="row"><button id="apply" class="primary" disabled>Εφαρμογή στο στοιχείο</button><button id="dl" disabled>Λήψη CSV</button></div>
<p id="msg" class="small"></p>
<script src="/studio/addon_client.js"></script>
<script src="ui.js"></script>
</body>
</html>
