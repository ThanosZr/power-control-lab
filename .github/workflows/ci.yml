# Tests on every push / pull request, the versioned zip as an artifact, and a release on tags v*.
name: ci

on:
  push:
    branches: [main, 'lab-*']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  unit:
    name: Python + λύτης browser (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Προαιρετικά πακέτα (έλεγχος Parquet, HDF5 και γραφικών, 3.15· ONNX με τον ελεγκτή αναφοράς και το ONNX Runtime, 4.19.2· ανάγνωση του σχεδίου DXF με το ezdxf, 4.19.4)
        run: pip install pyarrow h5py matplotlib onnx onnxruntime ezdxf
      - name: Python στον browser (Pyodide) για το μπλοκ Python
        run: npm install --no-save pyodide@0.26.4
      - name: Χάρτης κώδικα ενημερωμένος
        run: python tools/codemap.py --check
      - name: Δημόσιο API καταγεγραμμένο, χωρίς αφαίρεση (3.18, βάση για την 4.0)
        run: python tools/api_surface.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Αναφορά επαλήθευσης (τιμές μέσα στις ανοχές)
        run: python tools/verify.py --check
      - name: Βάρη του αντίστροφου μοντέλου (4.7, tutorial nn_compare) ίδια με την εκπαίδευση
        run: python tools/nn_weights.py --check

  octave:
    name: MATLAB/Octave (σενάρια από κώδικα)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Octave
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave fonts-freefont-otf xvfb
      - name: pcl_run, pcl_sweep, pcl_read, PclPlant και το παράθυρό του στο Octave
        run: |
          octave --version | head -1
          python -m unittest tests.test_matlab -v

  ui:
    name: Περιβάλλον (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Playwright, Chromium και τοπικό Pyodide
        run: |
          npm install --no-save playwright@1.63.0 pyodide@0.26.4
          python tools/get_pyodide.py
          npx playwright install --with-deps chromium
      - name: Isolated CAD viewport (T006)
        if: startsWith(github.ref_name, 'lab-cad-')
        run: |
          node --test experiments/cad_t006/test_viewport.mjs
          node experiments/cad_t006/test_browser.cjs
      - name: Isolated CAD parametric native + GUI (T007)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t007/editor.py') != ''
        run: |
          python -m venv "$RUNNER_TEMP/cad-native"
          CAD_PY="$RUNNER_TEMP/cad-native/bin/python"
          "$CAD_PY" -m pip install -r experiments/cad_t007/requirements-native.txt
          "$CAD_PY" -m pip check
          "$CAD_PY" -c "import build123d, OCP; print('Native imports OK')"
          "$CAD_PY" -m experiments.cad_t005.demo
          "$CAD_PY" -m unittest experiments.cad_t003.test_document experiments.cad_t004.test_worker experiments.cad_t005.test_native experiments.cad_t007.test_editor -v
          PYTHON="$CAD_PY" node experiments/cad_t007/test_browser.cjs
      - name: Isolated CAD sketch and constraints (T008)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t008/sketch.mjs') != ''
        run: |
          node --test experiments/cad_t008/test_sketch.mjs
          node experiments/cad_t008/test_browser.cjs
      - name: Isolated CAD feature history and native extrusion (T009)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t009/history.py') != ''
        run: |
          CAD_PY="$RUNNER_TEMP/cad-native/bin/python"
          "$CAD_PY" -m unittest experiments.cad_t009.test_history -v
          PYTHON="$CAD_PY" node experiments/cad_t009/test_browser.cjs
      - name: Isolated CAD revolve and boolean feature regeneration (T010)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t010/history.py') != ''
        run: |
          CAD_PY="$RUNNER_TEMP/cad-native/bin/python"
          "$CAD_PY" -m unittest experiments.cad_t010.test_features -v
          PYTHON="$CAD_PY" node experiments/cad_t010/test_browser.cjs
      - name: Isolated CAD sweep loft datum proof (T011-A)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t011/test_native.py') != ''
        run: |
          CAD_PY="$RUNNER_TEMP/cad-native/bin/python"
          "$CAD_PY" -m unittest experiments.cad_t011.test_native -v
      - name: Isolated CAD native sweep loft feature history and GUI (T011)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t011/test_history.py') != ''
        run: |
          CAD_PY="$RUNNER_TEMP/cad-native/bin/python"
          "$CAD_PY" -m unittest experiments.cad_t011.test_history -v
          PYTHON="$CAD_PY" node experiments/cad_t011/test_browser.cjs
      - name: Isolated CAD native fillet chamfer and edge references (T012)
        if: startsWith(github.ref_name, 'lab-cad-') && hashFiles('experiments/cad_t012/test_history.py') != ''
        run: |
          CAD_PY="$RUNNER_TEMP/cad-native/bin/python"
          "$CAD_PY" -m unittest experiments.cad_t012.test_history -v
          node --test experiments/cad_t012/test_renderer.mjs
          PYTHON="$CAD_PY" node experiments/cad_t012/test_browser.cjs
      - name: Σενάρια στον browser
        run: |
          python run.py --no-browser --port 8765 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          mkdir -p ui-out && cd ui-out
          for f in studio_flow editor_interactions features_flow blocks_flow wiring_flow step_flow scenario_flow addons_flow subcircuit_flow bus_flow live_flow line_flow ux_flow perf_flow speed_flow watch_flow ev_flow facts_flow scope_flow gis_flow study_flow window_flow dock_flow; do
            echo "== $f"; node ../tests/ui/$f.js http://127.0.0.1:8765/ .
          done
      - name: Εικόνες των σεναρίων
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-out/*.png
          if-no-files-found: ignore

  package:
    name: Zip της έκδοσης
    runs-on: ubuntu-latest
    needs: [unit, ui, octave]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Όνομα έκδοσης
        id: v
        run: |
          ref="${GITHUB_REF_NAME}"; ver="${ref#lab-}"; ver="${ver#v}"
          echo "name=Power_Control_Lab_${ver//./_}" >> "$GITHUB_OUTPUT"
      - run: git archive --format=zip --prefix=${{ steps.v.outputs.name }}/ -o ${{ steps.v.outputs.name }}.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.name }}
          path: ${{ steps.v.outputs.name }}.zip
      - name: Release (μόνο σε tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.v.outputs.name }}.zip
